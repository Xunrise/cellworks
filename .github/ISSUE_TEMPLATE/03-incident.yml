name: Incident — something is failing now
description: Record a live or recent incident. Feeds Stage 6 and earns a regression eval.
title: "[incident] "
labels: ["incident"]
body:
  - type: markdown
    attributes:
      value: |
        **If this is live and urgent, act first and file this second.** The
        record matters, but not more than the outage.

        Every incident earns two things once resolved: an entry in the lessons
        record, and an **eval case** in `evals/` written by whoever owned the
        incident — so the agent configuration is tested against this class of
        failure from then on. See `evals/README.md`.

  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Ongoing — still failing
        - Mitigated — degraded but stable
        - Resolved
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "1 — complete outage or data loss"
        - "2 — major function unavailable"
        - "3 — degraded, with a workaround"
        - "4 — minor or cosmetic"
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: What is the impact?
      description: What is not working, for whom, and since when.
    validations:
      required: true

  - type: input
    id: band
    attributes:
      label: Which control band or alert fired?
      description: >-
        The metric from `sdlc/bands.yaml`, if this came from monitoring. Write
        "none — reported by a human" if it did not, which is itself useful: it
        means detection missed this.
      placeholder: ci_test_failure_rate, 3 sigma
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: What happened and when, in UTC. Rough is fine; blank is not.
      placeholder: |
        14:02 deploy of #412 completed
        14:09 error rate began climbing
        14:15 first customer report
        14:22 rolled back
    validations:
      required: true

  - type: textarea
    id: mitigation
    attributes:
      label: What was done about it?
      description: Including anything that did not work — that is as informative as what did.
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: Cause, if known
      description: >-
        Leave blank rather than guessing. A blameless account of the mechanism,
        not of who did it.
    validations:
      required: false
