name: Intent — propose work
description: Describe a problem you want solved. No technical detail needed.
title: "[intent] "
labels: ["intent"]
body:
  - type: markdown
    attributes:
      value: |
        This is the entry point to the lifecycle. Describe the **problem**, not
        a solution — a good intent says what cannot be done today and what
        better would look like, and lets the design stage work out how.

        Write in your own words. No formal language is expected, and you do not
        need to know how the system works.

        A maintainer reviews this and applies the `sdlc:intent` label to start
        the chain. Claude then drafts an `intent.md` for your review as a pull
        request — you correct anything it misunderstood before it is accepted.

  - type: textarea
    id: problem
    attributes:
      label: What cannot be done today?
      description: >-
        The situation as you experience it. If there is a cost — time wasted,
        errors made, money lost, risk carried — say what it is.
      placeholder: >-
        Customers phone us to ask where their claim is. Handlers spend about a
        third of call time on calls that resolve in one sentence.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would better look like?
      description: >-
        What someone would *notice* if this were solved. Describe the change
        from the outside, not how to build it.
      placeholder: >-
        Customers can see the status of their claim and what happens next
        without phoning anyone.
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: Who and what does this affect?
      description: People, teams, or systems.
      placeholder: Claims handlers, the customer portal, the claims-core API.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: What must stay true?
      description: >-
        Anything that must not change, and anything explicitly out of scope.
        Leave blank if you do not know — the design stage will find them.
      placeholder: >-
        No new personal data in the portal. Must use the login customers
        already have.
    validations:
      required: false

  - type: textarea
    id: open-questions
    attributes:
      label: What is still unresolved?
      description: >-
        Questions you cannot answer yourself. These are carried forward
        explicitly rather than guessed at — an unanswered one holds the work at
        a gate until a human answers it, which is deliberate.
      placeholder: Do third-party loss adjusters need access too?
    validations:
      required: false

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Before you file
      options:
        - label: >-
            I have described a problem rather than specified a solution, as far
            as I am able.
          required: true
