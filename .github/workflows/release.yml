name: Release

# Push a tag vX.Y.Z whose version matches Cargo.toml. The build job has no
# write token; the publish job has no build. Releases go out only from tags
# pushed by the repository owner.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-app.sh "$GITHUB_REPOSITORY"
      - name: The packaged app reports its version
        run: |
          said=$(dist/Cellworks.app/Contents/MacOS/cellworks --version)
          [ "$said" = "cellworks ${GITHUB_REF_NAME#v}" ] || { echo "$said" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/cellworks-app-*.zip
            dist/manifest.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest --generate-notes \
            cellworks-app-*.zip manifest.json
      - name: The latest manifest names this version
        run: |
          for _ in $(seq 1 30); do
            got=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" | jq -r .version || true)
            [ "v$got" = "$GITHUB_REF_NAME" ] && exit 0
            sleep 10
          done
          echo "the latest manifest still says $got" >&2
          exit 1

      # The cask template in packaging/homebrew, with this release's version and sha256.
      - uses: actions/checkout@v6
        with:
          path: src
          sparse-checkout: packaging/homebrew
      # Only stable tags update the tap, and only once the HOMEBREW_TAP_TOKEN secret exists.
      - name: Update Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping tap update"; exit 0; fi
          version=$(jq -r .version manifest.json)
          sha=$(jq -r .app.sha256 manifest.json)
          sed -e "s/^  version \".*\"$/  version \"$version\"/" \
              -e "s/^  sha256 \".*\"$/  sha256 \"$sha\"/" \
              src/packaging/homebrew/cellworks.rb > cellworks.rb
          grep -q "version \"$version\"" cellworks.rb && grep -q "sha256 \"$sha\"" cellworks.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Xunrise/homebrew-tap.git" tap
          mkdir -p tap/Casks && cp cellworks.rb tap/Casks/cellworks.rb
          cd tap
          git config user.name "cellworks release"; git config user.email "actions@users.noreply.github.com"
          git add Casks/cellworks.rb
          git diff --cached --quiet || { git commit -m "cellworks $version" && git push; }
