name: Pages

# Deploys site/ to https://xunrise.github.io/cellworks/ on changes to the site or
# its screenshots (or run it by hand). The screenshots live in docs/assets/ and
# are copied in at build time, so the README and the site share one set.

on:
  push:
    branches: [main]
    paths: [site/**, docs/assets/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the screenshots and films into the site
        run: mkdir -p site/assets && cp -R docs/assets/. site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
