name: SDLC — answer a held stage

# Calls The-Factory's answer stage at the pinned version. A comment from someone
# with write access on an issue the chain holds (sdlc:needs-human) is written
# into the held artifact, and the chain continues.

on:
  issue_comment:
    types: [created]

jobs:
  answer:
    permissions:
      contents: write
      issues: write
      actions: write
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-answer.yml@094b1261f4b7b52ba5c642add7a3620688f23c25  # trial of The-Factory PR #31, not a release
    secrets: inherit
