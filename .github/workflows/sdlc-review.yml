name: SDLC Stage 5 — review

# Calls The-Factory's review stage at the pinned version. The trigger lives here;
# everything else — the steps, scripts, skills and hooks — is the factory's.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  pull_request:
    # closed: a pull request into test that merged moves its issue to done.
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The build stage starts this for the pull request it opens, which triggers
  # no pull_request event of its own.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request to review.
        required: true

jobs:
  review:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write   # a pushed fix starts CI and the review again
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-review.yml@v3.0.0
    secrets: inherit
    with:
      pr: ${{ inputs.pr }}
      verify-command: 'cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'
