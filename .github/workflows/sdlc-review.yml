name: SDLC Stage 5 — review

# Calls The-Factory's review stage at the pinned version. The trigger lives here;
# everything else — the steps, scripts, skills and hooks — is the factory's.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The build stage starts this for the pull request it opens, which triggers
  # no pull_request event of its own.
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request to review.
        required: true

jobs:
  review:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-review.yml@c2fa0c28df62cd606ecefe26150d47fc86a384ef  # trial of The-Factory PR #31, not a release
    secrets: inherit
    with:
      pr: ${{ inputs.pr }}
