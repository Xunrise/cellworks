name: SDLC Stage 4 — build

# Calls The-Factory's build stage at the pinned version. The trigger lives here;
# everything else — the steps, scripts, skills and hooks — is the factory's.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  push:
    branches: ['feature/**']
    paths:
      - 'sdlc/[0-9][0-9][0-9][0-9]-*/plan.md'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write   # the stage starts the pull request's checks and review
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-build.yml@c2fa0c28df62cd606ecefe26150d47fc86a384ef  # trial of The-Factory PR #31, not a release
    secrets: inherit
    with:
      # This product's checks, re-run after the agent finishes. Keep it the
      # same as the "Verifying your work" section of CLAUDE.md.
      verify-command: 'cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace'
      # node-version: '22'
      # node-cache-path: package-lock.json
