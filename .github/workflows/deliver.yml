name: Deliver

# Calls The-Factory's deliver stage at the pinned version on every push to
# test and main: each deliverable under .github/deliverables/ runs, and the
# results land on a GitHub Release (the rolling `test` prerelease, or
# v<version> on main) and, for a URL, a GitHub Deployment. The pipeline
# delivers each pull request itself, as channel pr.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  push:
    branches: [test, main]

jobs:
  deliver:
    permissions:
      contents: write      # the release
      deployments: write   # a deployment for each url deliverable
      # What the deliverables themselves need, for example:
      # pages: write       # static-web, with id-token: write
      # id-token: write
      # packages: write    # container
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-deliver.yml@v3.0.0
    with:
      channel: ${{ github.ref_name }}
      # Prints the version a push to main releases as v<version>.
      version-command: GH_TOKEN=${{ github.token }} scripts/version.sh
    secrets: inherit
