name: SDLC Stage 2 — spec

# Calls The-Factory's spec stage at the pinned version. The trigger lives here;
# everything else — the steps, scripts, skills and hooks — is the factory's.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  push:
    branches: ['feature/**']
    paths:
      - 'sdlc/[0-9][0-9][0-9][0-9]-*/intent.md'
  workflow_dispatch:

jobs:
  spec:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # the stage dispatches the next one on the feature branch
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-spec.yml@c2fa0c28df62cd606ecefe26150d47fc86a384ef  # trial of The-Factory PR #31, not a release
    secrets: inherit
