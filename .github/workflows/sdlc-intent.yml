name: SDLC Stage 1 — intent

# Calls The-Factory's intent stage at the pinned version. The trigger lives here;
# everything else — the steps, scripts, skills and hooks — is the factory's.
# Move to a new factory version with The-Factory's scripts/upgrade.sh.

on:
  issues:
    types: [labeled]

jobs:
  intent:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write   # the stage dispatches the next one on the feature branch
    uses: squer-solutions/The-Factory/.github/workflows/sdlc-intent.yml@8a2518f24e4041c617c9fad065ca5a9b37126f1f  # trial of The-Factory PR #31, not a release
    secrets: inherit
