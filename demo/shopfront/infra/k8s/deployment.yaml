apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopfront
  template:
    metadata:
      labels:
        app: shopfront
    spec:
      containers:
        - name: web
          image: registry.example.com/shopfront:latest
          ports:
            - containerPort: 80
