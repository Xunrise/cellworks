# Critical-change flags.
#
# A change that touches one of these areas is recorded in the sdlc-event as
# `critical: [<flag>, ...]`, so the dashboard can put it in front of a person.
# `sdlc/scripts/critical.sh` matches each changed path, lowercased, against the
# globs below. A glob's `*` also matches `/`, so `*auth*` matches any path with
# "auth" anywhere in it.
#
# A product replaces this file whole by committing its own sdlc/critical.yaml.
#
# Cellworks: The-Factory's default, without "*session*" under auth. Session is
# a Cellworks domain term (a Claude Code session on the map, the agent-sessions
# crate) and has nothing to do with authentication.
#
# NOTE ON SHAPE: critical.sh parses this file with a deliberately simple reader
# (no YAML library is available on a bare runner). Keep to one flag per line
# under `flags:`, and one quoted glob per `- ` line under it.

flags:
  auth:
    - "*auth*"
    - "*login*"
    - "*password*"
    - "*credential*"
    - "*jwt*"
  payments:
    - "*payment*"
    - "*billing*"
    - "*invoice*"
    - "*checkout*"
    - "*refund*"
  personal-data:
    - "*personal*"
    - "*pii*"
    - "*gdpr*"
    - "*privacy*"
    - "*consent*"
    - "*customer*"
    - "*profile*"
  infra-permissions:
    - "infra/permissions/*"
    - "infra/sdlc-infra.yml"
    - "*iam*.yml"
    - "*iam*.yaml"
    - "*iam*.json"
  dependencies:
    - "*package.json"
    - "*package-lock.json"
    - "*yarn.lock"
    - "*pnpm-lock.yaml"
    - "*requirements*.txt"
    - "*pyproject.toml"
    - "*poetry.lock"
    - "*go.mod"
    - "*go.sum"
    - "*cargo.toml"
    - "*cargo.lock"
    - "*gemfile*"
    - "*pom.xml"
    - "*build.gradle*"
